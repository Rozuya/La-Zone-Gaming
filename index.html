<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Zone Gaming | La plateforme E-sport & Gaming FR</title>
    <link rel="stylesheet" href="style.css">
    <!-- Polices gaming et lisibles -->

<body>

    <!-- BARRE DE NAVIGATION -->
    <header class="navbar">
        <div class="logo" onclick="navigateTo('home')">

        <nav id="nav-menu">
            <ul class="nav-links">
                <li><a href="#" onclick="navigateTo('home')">Accueil</a></li>
