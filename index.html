<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROZUYA | Gaming Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="background-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <main class="profile-card">
        <!-- HEADER PROFIL -->
        <header class="profile-header">
            <div class="avatar-container">
                <div class="avatar-ring"></div>
                <img src="rozuya.jpg" alt="ROZUYA Avatar" class="avatar-img" id="user-avatar">
            </div>
            <h1 class="username">ROZUYA</h1>
            <p class="tagline">SHINZŌ夜 • Content Creator & Gamer</p>
        </header>

        <!-- RÉSEAUX SOCIAUX -->
        <section class="social-links">
            <a href="https://www.twitch.tv/hol_rozuya" target="_blank" class="social-btn twitch">
                <i class="fa-brands fa-twitch"></i>
                <span>Twitch</span>
            </a>
            <!-- LIEN YOUTUBE CORRIGÉ -->
            <a href="https://www.youtube.com/@SHINZOyo" target="_blank" class="social-btn youtube">
                <i class="fa-brands fa-youtube"></i>
                <span>YouTube</span>
            </a>
        </section>

        <!-- IDENTIFIANTS JEUX & DISCORD -->
        <section class="ids-section">
            <h2 class="section-title"><i class="fa-solid fa-gamepad"></i> Mes Pseudos & Contacts</h2>

            <!-- EPIC GAMES -->
            <div class="id-box epic" onclick="copyText('7 SHINZŌ', 'Epic Games')">
                <div class="id-info">
                    <i class="fa-solid fa-bolt id-icon"></i>
                    <div>
                        <span class="platform-name">Epic Games</span>
                        <span class="id-value">7 SHINZŌ</span>
                    </div>
                </div>
                <button class="copy-btn" title="Copier"><i class="fa-regular fa-copy"></i></button>
            </div>

            <!-- RIOT GAMES -->
            <div class="id-box riot" onclick="copyText('SHINZO #31052', 'Riot ID')">
                <div class="id-info">
                    <i class="fa-solid fa-crosshair id-icon"></i>
                    <div>
                        <span class="platform-name">Riot Games (Valorant)</span>
                        <span class="id-value">SHINZO #31052</span>
                    </div>
                </div>
                <button class="copy-btn" title="Copier"><i class="fa-regular fa-copy"></i></button>
            </div>

            <!-- STEAM -->
            <div class="id-box steam" onclick="copyText('1270447966', 'Code Ami Steam')">
                <div class="id-info">
                    <i class="fa-brands fa-steam id-icon"></i>
                    <div>
                        <span class="platform-name">Steam (In-game: rozuya)</span>
                        <span class="id-value">Code Ami: 1270447966</span>
                    </div>
                </div>
                <button class="copy-btn" title="Copier"><i class="fa-regular fa-copy"></i></button>
            </div>

            <!-- DISCORD -->
            <div class="id-box discord" onclick="copyText('rozuya.', 'Discord')">
                <div class="id-info">
                    <i class="fa-brands fa-discord id-icon"></i>
                    <div>
                        <span class="platform-name">Discord (Voc: SHINZŌ.exe)</span>
                        <span class="id-value">rozuya.</span>
                    </div>
                </div>
                <button class="copy-btn" title="Copier"><i class="fa-regular fa-copy"></i></button>
            </div>
        </section>

        <footer>
            <p>© ROZUYA | Gaming Hub</p>
        </footer>
    </main>

    <!-- NOTIFICATION DE COPIE -->
    <div id="toast" class="toast">Copié dans le presse-papier !</div>

    <script src="script.js"></script>
</body>
</html>
